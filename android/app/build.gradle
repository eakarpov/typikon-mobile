plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

// Ключ подписи релиза. Раньше здесь стоял signingConfigs.debug из шаблона, то
// есть ключом был ~/.android/debug.keystore — файл, который SDK пересоздаёт
// молча. Один раз это уже случилось: сборки 1.0.0–1.3.0 подписаны сертификатом
// d1d7311c…, начиная с 1.4.0 — 064cc2b5…, и все, кто остался на 1.3.0, поставить
// обновление поверх больше не могут.
//
// Теперь ключ берётся из android/key.properties (в git не хранится, см.
// android/.gitignore; образец — key.properties.example). Ключ тот же самый, что
// подписывал 1.4.0+, только вынесенный из ~/.android/ и с собственным паролем,
// поэтому обновления поверх продолжают ставиться.
def keystorePropertiesFile = rootProject.file('key.properties')
def keystoreProperties = new Properties()
def hasKeystore = keystorePropertiesFile.exists()
if (hasKeystore) {
    keystorePropertiesFile.withReader('UTF-8') { reader ->
        keystoreProperties.load(reader)
    }
}

android {
    namespace "su.typikon.typikon"

    compileSdkVersion rootProject.ext.compileSdkVersion
    ndkVersion flutter.ndkVersion

    // Java 11, а не 8: на восьмёрке AGP ругался при каждой сборке, что значение
    // устарело и будет убрано.
    //
    // Пользователя это не касается. Здесь задан язык и версия class-файлов для
    // двух файлов самого модуля (MainActivity.kt и сгенерированный
    // GeneratedPluginRegistrant.java) — а не то, на каких устройствах пойдёт
    // приложение: минимальную версию Android задаёт minSdkVersion и она не
    // тронута (24). Всё, что компилятор выдаст, D8 всё равно переводит в dex
    // под этот minSdk, а библиотечные вызовы новее восьмёрки подменяет
    // coreLibraryDesugaring — он включён строкой ниже и включён был всегда.
    //
    // jvmTarget держится в согласии с targetCompatibility: разъехавшись, они
    // роняют сборку, и это единственное, за чем тут надо следить.
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "su.typikon.typikon"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-build-configuration.
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    signingConfigs {
        if (hasKeystore) {
            release {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            // Без key.properties релиз остаётся неподписанным и падает на
            // проверке ниже. Молчаливый откат на debug-ключ здесь недопустим:
            // именно так и разъехались подписи между 1.3.0 и 1.4.0.
            if (hasKeystore) {
                signingConfig signingConfigs.release
            }
            minifyEnabled true
        }
        // В profile и debug R8 не нужен: он только замедляет сборку и путает
        // стеки при отладке, а проверять правила сжатия надо на релизе, где они
        // и применяются. Стояло true во всех трёх — похоже, по недосмотру.
        profile {
            minifyEnabled false
        }
        debug {
            minifyEnabled false
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation 'androidx.window:window:1.1.0'
    implementation 'androidx.window:window-java:1.1.0'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
}

// Сборка релиза без ключа должна останавливаться с внятным объяснением, а не
// тихо выдавать APK, который потом не встанет поверх установленного.
gradle.taskGraph.whenReady { graph ->
    def buildsRelease = graph.allTasks.any { it.project == project && it.name.contains('Release') }
    if (buildsRelease && !hasKeystore) {
        throw new GradleException(
            "Не найден android/key.properties — релиз подписать нечем.\n" +
            "Скопируйте android/key.properties.example в android/key.properties и укажите\n" +
            "путь к хранилищу и пароли. Ключ должен быть тем же, которым подписаны сборки\n" +
            "начиная с 1.4.0 (сертификат SHA-256 064cc2b5…ccdb), иначе у пользователей\n" +
            "сломается обновление поверх установленного приложения."
        )
    }
}
