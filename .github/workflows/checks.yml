# Анализатор и тесты на каждую ветку и каждый pull request.
#
# Заводится теперь, потому что теперь есть что проверять: тестов пятьсот с
# лишним, и `flutter test` зелёный. До этого CI сторожил бы пустоту.
#
# Сборки APK здесь нет нарочно: релиз подписывается ключом, который лежит вне
# репозитория и невосстановим (см. android/key.properties.example), и класть его
# в секреты GitHub — значит делать вторую копию того, что и так нельзя потерять.
name: Проверки

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Тот же канал и та же версия, на которой работает разработка:
          # иначе разойдутся предупреждения анализатора, и «зелено у меня»
          # перестанет значить «зелено в CI».
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      # .env в репозитории нет и быть не должно, но он объявлен ассетом в
      # pubspec.yaml — без файла сборка и тесты падают на отсутствующем ассете.
      # Пустой годится: ключ доступа не секрет и только отмеряет частоту
      # запросов, а в тестах сеть и не трогается.
      - name: Завести пустой .env
        run: cp .env.example .env

      - name: Зависимости
        run: flutter pub get

      # --no-fatal-infos нарочно: предупреждений в проекте теперь ноль, и
      # сторожим мы именно этот ноль. Подсказок (info) остаётся полторы сотни —
      # неявные tear-off, `new`, строгий вывод типов; чинить их разом значит
      # сделать правку на весь проект, а держать CI красным до тех пор — значит
      # приучить не смотреть на него вовсе.
      - name: Разбор
        run: flutter analyze --no-fatal-infos

      - name: Тесты
        run: flutter test
